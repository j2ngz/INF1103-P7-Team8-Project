name: CI

# Runs the automated tests on every push and pull request
on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (no live AI API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

  docker:
    name: Docker build and tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t resume-screener .
      - name: Run the tests inside the container
        run: docker run --rm resume-screener python -m unittest discover -s tests -t . -v
